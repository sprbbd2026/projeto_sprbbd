name: sprbbd

# Sobe tudo: 2 bancos + 2 backends + 2 frontends (modo dev com hot-reload).
# Uso:  docker compose up --build
# Os fronts apontam para os backends via portas publicadas no host (localhost:8000/8001),
# pois quem faz as chamadas e o navegador. Os backends falam com o banco pelo nome do
# servico dentro da rede do compose (ts1-db / ts2-db).

services:

  ts1-back:
    build: ./ts1/ts1-back
    container_name: sprbbd-ts1-back
    # Migrations out of sync with models; create_all + stamp head is safer for fresh Docker DBs
    command: sh -c "/opt/venv/bin/python -c 'from app.db.database import engine; from app.db import models; models.Base.metadata.create_all(bind=engine)' && /opt/venv/bin/alembic stamp head && exec /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      POSTGRES_HOST: 161.24.23.108
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sprbbd
      JWT_SECRET_KEY: corinthians
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    volumes:
      - ./ts1/ts1-back:/app

  ts2-back:
    build: ./ts2/ts2-back
    container_name: sprbbd-ts2-back
    # ts2 cria as tabelas via create_all no startup (nao tem alembic.ini)
    environment:
      POSTGRES_HOST: 161.24.23.108
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sprbbd
      JWT_SECRET_KEY: corinthians
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "60"
    ports:
      - "8001:8001"
    volumes:
      - ./ts2/ts2-back:/app

  ts1-front:
    build: ./ts1/ts1-front
    container_name: sprbbd-ts1-front
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./ts1/ts1-front:/app
      - /app/node_modules
    depends_on:
      - ts1-back

  ts2-front:
    build: ./ts2/ts2-front
    container_name: sprbbd-ts2-front
    environment:
      VITE_API_URL: http://localhost:8001
      VITE_TS1_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - ./ts2/ts2-front:/app
      - /app/node_modules
    depends_on:
      - ts2-back
