services:
  postgres:
    image: docker.io/library/postgres:15
    container_name: ts2-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DATABASE_KEY}
      POSTGRES_DB: sprbbd-db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data:Z

volumes:
  postgres_data:
